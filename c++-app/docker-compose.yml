version: '3.8'

services:
  # --- 1. C++ Application Service ---
  cpp_app:
    build:
      context: ./cpp-app
      dockerfile: Dockerfile
    container_name: cpp_service
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    depends_on:
      postgres_db:
        condition: service_started
      redis_cache:
        condition: service_started
    networks:
      - app-net

  # --- 2. PostgreSQL Database Service ---
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  # --- 3. Redis Cache Service ---
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge