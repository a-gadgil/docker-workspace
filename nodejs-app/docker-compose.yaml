services:
  proxy:
    image: nginx:alpine
    container_name: tier1_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: tier2_frontend
    environment:
      - PORT=3000
      - API_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: tier3_backend
    environment:
      - PORT=4000
      - DB_HOST=database
      - REDIS_HOST=cache
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app-network

  cache:
    image: redis:7-alpine
    container_name: tier4_cache
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - app-network

  database:
    image: postgres:15-alpine
    container_name: tier5_database
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: