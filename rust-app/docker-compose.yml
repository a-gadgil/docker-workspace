
services:
  # Tier 3: Application Layer (Rust)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_container
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql://root:secretpassword@mysql:3306/app_db
      - MEMCACHED_URL=tcp://memcached:11211
    depends_on:
      mysql:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      - app-net

  # Tier 2: Database Layer (MySQL)
  mysql:
    image: mysql:latest
    container_name: db_container
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # Tier 1: Caching Layer (Memcached)
  memcached:
    image: memcached:latest
    container_name: memcached_container
    ports:
      - "11211:11211"
    networks:
      - app-net

volumes:
 mysql_data:

networks:
  app-net:
    driver: bridge