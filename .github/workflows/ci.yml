name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: go-app

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/go-app"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./go-app
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o go-app-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-app-image
          path: go-app-image.tar
          retention-days: 1

  scan:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: go-app-image

      - name: Run Trivy scan on image tarball
        uses: aquasecurity/trivy-action@master
        with:
          input: go-app-image.tar
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  push:
    name: Push to Docker Hub
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/go-app"
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: go-app-image

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Load, tag, and push image
        run: |
          docker load < go-app-image.tar
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
