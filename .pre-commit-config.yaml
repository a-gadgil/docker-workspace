repos:
  # ==========================================
  # 1. Universal Security & File Hygiene
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(lock|sum)$
      - id: end-of-file-fixer
        exclude: \.(lock|sum)$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
        exclude: ^(node_modules/|.*/node_modules/|.*/target/)
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # ==========================================
  # 2. Containers & Infrastructure
  # ==========================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--failure-threshold', 'error']

  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy-fs-scanner
        entry: trivy fs --security-checks config,vuln --skip-dirs node_modules,vendor,.venv,target,dist,build .
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: Dockerfile$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # ==========================================
  # 3. Runtime Linters & Formatters
  # ==========================================
  # Go (go-app)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^go-app/.*\.go$

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd go-app && golangci-lint run ./...'
        language: system
        pass_filenames: false
        files: ^go-app/.*\.go$

  # Python (python-app)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        files: ^python-app/.*\.py$
      - id: ruff-format
        files: ^python-app/.*\.py$

  # Node.js (nodejs-app)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: system
        files: ^nodejs-app/.*\.(js|mjs|cjs|ts|jsx|tsx|json|md|yml|yaml)$

  # Rust (rust-app)
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo-fmt-check
        entry: bash -c 'cd rust-app && cargo fmt --check'
        language: system
        pass_filenames: false
        files: ^rust-app/.*\.rs$

  # Java (java-app) & C++ (cpp-app)
  - repo: local
    hooks:
      - id: cpp-clang-format-check
        name: cpp-clang-format-check
        entry: clang-format --dry-run --Werror
        language: system
        files: ^cpp-app/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
