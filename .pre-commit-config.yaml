repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^node_modules/
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--failure-threshold', 'error'] # Only fail on errors, ignore style warnings

  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy-fs-scanner
        entry: trivy fs --security-checks config,vuln .
        language: system
        pass_filenames: false
        stages: [pre-commit]
