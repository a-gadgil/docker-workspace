repos:
  # 1. Global Repository Hygiene & Safety
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^(node_modules/|java-app/.*/node_modules/)
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # 2. Secret Leak Prevention
  # ==========================================
  # 1. Universal Security & File Hygiene
  # ==========================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # 3. Containerfile & Dockerfile Linting
  # ==========================================
  # 2. Infrastructure & Containers
  # ==========================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--failure-threshold', 'error']

  # 4. Local Security & Configuration Scan (Optimized with skip directories)
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy-fs-scanner
        entry: trivy fs --security-checks config,vuln --skip-dirs node_modules,vendor,.venv,dist,build .
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: Dockerfile$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # ==========================================
  # 3. Enterprise Runtime Linters & Formatters
  # ==========================================
  # Go (go-app)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^go-app/
      - id: golangci-lint
        files: ^go-app/

  # Python (python-app)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        files: ^python-app/
      - id: ruff-format
        files: ^python-app/

  # Node.js / TypeScript (nodejs-app)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^nodejs-app/
