
networks:
  python-net:
    driver: bridge

volumes:
    mysql_data:
    redis_data:

services:
  python-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-app-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=mysql+pymysql://app_user:app_password@mysql:3306/app_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - python-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: python-mysql
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - python-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp_user", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: python-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - python-net
    restart: unless-stopped