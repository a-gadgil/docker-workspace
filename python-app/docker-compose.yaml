
services:
  # --- 1. Python Application Service ---
  python_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_service
    ports:
      - "8000:8000"
    environment:
      - PG_HOST=postgres_db
      - PG_PORT=5432
      - COUCH_HOST=couchdb_db
      - COUCH_PORT=5984
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    depends_on:
      postgres_db:
        condition: service_started
      couchdb_db:
        condition: service_started
      redis_cache:
        condition: service_started
    networks:
      - app-net

  # --- 2. PostgreSQL Relational Backend ---
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: relational_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  # --- 3. CouchDB Document Backend ---
  couchdb_db:
    image: couchdb:latest
    container_name: couchdb_db
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdata:/opt/couchdb/data
    networks:
      - app-net

  # --- 4. Redis Cache Layer ---
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - app-net

volumes:
  pgdata:
  couchdata:

networks:
  app-net:
    driver: bridge