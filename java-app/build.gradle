plugins {
    id 'java'
}

group = 'com.app'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Zero external dependencies needed for com.sun.net.httpserver!
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.app.Main'
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
