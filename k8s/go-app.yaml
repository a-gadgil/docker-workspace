apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app
  namespace: default
  labels:
    app: go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
        - name: go-app
          image: docker.io/baremetal24/go-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-app-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: go-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
