apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-runtime-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/thinksapient/docker-workspace.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
